services:

  mysql:
    image: mysql:8.4
    container_name: mandatodo_mysql

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10


  initialize:
    build:
      context: ./backend
    command: ["node", "initialize.js"]
    restart: "no"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      SESSION_SECRET_FILE: /runtime/session-secret
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./database:/database:ro
      - session_config:/runtime
    depends_on:
      mysql:
        condition: service_healthy

  backend:
    build:
      context: ./backend

    container_name: mandatodo_backend

    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
      PORT: 3000
      SESSION_SECRET: ${SESSION_SECRET:-}
      SESSION_SECRET_FILE: /runtime/session-secret
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}

    ports:
      - "3000:3000"

    volumes:
      - ./backend:/app
      - /app/node_modules
      - session_config:/runtime:ro

    depends_on:
      mysql:
        condition: service_healthy
      initialize:
        condition: service_completed_successfully


  frontend:
    build:
      context: ./frontend

    container_name: mandatodo_frontend

    environment:
      API_PROXY_TARGET: http://backend:3000
      VITE_USE_POLLING: 'true'

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    depends_on:
      - backend


volumes:
  mysql_data:
  session_config:
