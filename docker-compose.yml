services:

  mysql:
    image: mysql:8.4
    container_name: mandatodo_mysql

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: ./backend

    container_name: mandatodo_backend

    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      GEOCODER_PROVIDER: ${GEOCODER_PROVIDER:-georef}
      GEOCODE_TIMEOUT_MS: ${GEOCODE_TIMEOUT_MS:-5000}
      GEOREF_BASE_URL: ${GEOREF_BASE_URL:-https://apis.datos.gob.ar/georef/api}
      GEOREF_TIMEOUT_MS: ${GEOREF_TIMEOUT_MS:-3000}
      DUPLICADOS_VENTANA_HORAS: ${DUPLICADOS_VENTANA_HORAS}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_OPERADOR_PASSWORD: ${SEED_OPERADOR_PASSWORD}
      SEED_CHOFER_PASSWORD: ${SEED_CHOFER_PASSWORD}
      PORT: 3000

    ports:
      - "3000:3000"

    volumes:
      - ./backend:/app
      - /app/node_modules

    depends_on:
      mysql:
        condition: service_healthy


  frontend:
    build:
      context: ./frontend

    container_name: mandatodo_frontend

    environment:
      VITE_API_PROXY: http://backend:3000

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    depends_on:
      - backend


volumes:
  mysql_data:
